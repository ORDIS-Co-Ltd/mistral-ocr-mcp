[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mistral-ocr-mcp"
version = "0.2.1"
description = "MCP server for extracting text and images from documents using Mistral OCR API"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "ORDIS Co., Ltd." }
]

dependencies = [
    "mcp>=2",
    "mistralai>=2.0.0,!=2.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
mistral-ocr-mcp = "mistral_ocr_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/ORDIS-Co-Ltd/mistral-ocr-mcp"
Repository = "https://github.com/ORDIS-Co-Ltd/mistral-ocr-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/mistral_ocr_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "SIM", "TID252"]
ignore = [
    "E501",
    "N818",
]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.8.0",
]
